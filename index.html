<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SoleBook</title>
  <meta name="description" content="Ventas, clientes e inventario de zapatillas y ropa">
  <meta name="theme-color" content="#F6F3EC">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SoleBook">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main" id="main"><div class="loading">Cargando…</div></main>
    <nav class="tabbar" id="tabbar"></nav>
  </div>
  <div class="sheet-wrap" id="sheet-wrap" hidden>
    <div class="sheet-backdrop" data-act="close-sheet"></div>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true"></section>
  </div>
  <div class="toast" id="toast" hidden></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
